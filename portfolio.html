<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rachel Barlow · Portfolio</title>
    <meta name="description" content="The portfolio of artist Rachel Barlow" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preload" href="fonts/noto-sans.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/noto-serif.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/main.js" defer></script>
  </head>
  <body data-page-title="Portfolio">
    <header class="site-header">
      <a class="site-name" href="./" data-site="name">Rachel Barlow</a>
      <nav>
        <a href="portfolio" aria-current="page">Portfolio</a>
        <a href="./#about">About</a>
      </nav>
    </header>

    <main>
      <section aria-label="Portfolio">
        <ul class="gallery"></ul>
      </section>
    </main>

    <footer class="site-footer">
      <p>© <span data-year></span> <span data-site="name">Rachel Barlow</span></p>
    </footer>

    <dialog class="lightbox" aria-label="Artwork" tabindex="-1">
      <button class="lightbox-close" aria-label="Close">×</button>
      <button class="lightbox-prev" aria-label="Previous">‹</button>
      <figure>
        <img alt="" />
        <figcaption></figcaption>
      </figure>
      <button class="lightbox-next" aria-label="Next">›</button>
    </dialog>
  </body>
</html>
